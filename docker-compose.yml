# Wissenscheck – alles läuft lokal in Docker, keine externen Dienste
# (auch die automatische Übersetzung läuft im eigenen Container „translate“).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wissenscheck
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wissenscheck}
      POSTGRES_DB: wissenscheck
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wissenscheck -d wissenscheck"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: ./app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://wissenscheck:${DB_PASSWORD:-wissenscheck}@db:5432/wissenscheck
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      SESSION_SECRET: ${SESSION_SECRET:-bitte-in-der-env-datei-aendern}
      SEED_DEMO: ${SEED_DEMO:-true}
      BASE_PATH: ${BASE_PATH:-}
      ENABLED_LANGS: ${ENABLED_LANGS:-en,pl,tr,ro,fr,es,it,nl,cs,hu,ru,uk,ar}
      TRANSLATE_URL: ${TRANSLATE_URL:-http://translate:5000}
      TRANSLATE_PROVIDER: ${TRANSLATE_PROVIDER:-}
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
    volumes:
      - uploads:/data/uploads
    ports:
      - "${PORT:-3000}:3000"

  # Eigener Übersetzer (LibreTranslate). Lädt nur die Sprachen aus ENABLED_LANGS (+ Deutsch) – das hält den Speicherbedarf klein.
  # Ohne Übersetzer läuft das Tool weiter; nur die Schaltfläche „Übersetzen“ im Admin-Bereich meldet dann einen Fehler.
  translate:
    image: libretranslate/libretranslate:latest
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: de,${ENABLED_LANGS:-en,pl,tr,ro,fr,es,it,nl,cs,hu,ru,uk,ar}
      LT_UPDATE_MODELS: "false"
    volumes:
      - translatemodels:/home/libretranslate/.local

volumes:
  translatemodels:
  dbdata:
  uploads:
